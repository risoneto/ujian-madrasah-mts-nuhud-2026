<script>

let namaUser="";
let aktif=false;
let waktu=5400;

// DATA MAPEL
let mapel=[

{n:"BAHASA INDONESIA",t:"2026-05-04",m:"07:30",s:"09:30",l:"https://forms.gle/RWxJRET5PsmxesQS8",k:"BI45Z"},
{n:"AL QUR'AN HADITS",t:"2026-05-04",m:"10:00",s:"11:30",l:"https://forms.gle/4WasoEc7W24LRP1X7",k:"QH18X"},

{n:"BAHASA INGGRIS",t:"2026-05-05",m:"07:30",s:"09:30",l:"https://forms.gle/eA7bS2UZDQhQViy38",k:"EN33P"},
{n:"AKIDAH AKHLAK",t:"2026-05-05",m:"10:00",s:"11:30",l:"https://forms.gle/qWfJC793EygbYyY46",k:"AA90L"},

{n:"MATEMATIKA",t:"2026-05-06",m:"07:30",s:"09:30",l:"https://forms.gle/kwL6izDmTBwg2qwx9",k:"MT66Q"},
{n:"FIKIH",t:"2026-05-06",m:"10:00",s:"11:30",l:"https://forms.gle/KUrWCGbYYhbev8Ri7",k:"FK21R"},

{n:"IPA",t:"2026-05-07",m:"07:30",s:"09:30",l:"https://forms.gle/HtSTDQtKpRv9cM338",k:"IP54T"},
{n:"SKI",t:"2026-05-07",m:"10:00",s:"11:30",l:"https://forms.gle/ng8sVxViBjiw5DfT7",k:"SK88Y"},

{n:"PENDIDIKAN PANCASILA",t:"2026-05-08",m:"07:00",s:"09:00",l:"https://forms.gle/sGe7jvXERaLh5tuj8",k:"PP70B"},
{n:"SENI BUDAYA",t:"2026-05-08",m:"09:30",s:"11:00",l:"https://forms.gle/JFa9xz6ys1hxZBaaA",k:"SB39C"},

{n:"IPS",t:"2026-05-09",m:"07:30",s:"09:30",l:"https://forms.gle/3GMXZX6WFs6384UFA",k:"IS12D"},
{n:"BAHASA JAWA",t:"2026-05-09",m:"10:00",s:"11:30",l:"https://forms.gle/AVCZjCxcDX3uj5ME6",k:"BJ84E"},

{n:"BAHASA ARAB",t:"2026-05-11",m:"07:30",s:"09:30",l:"",k:"BA27F"},
{n:"INFORMATIKA",t:"2026-05-11",m:"10:00",s:"11:30",l:"",k:"IT59G"}

];

// LOGIN
function login(){
let n=document.getElementById("nama").value;
if(!n){alert("Pilih nama!");return;}
namaUser=n;

document.getElementById("loginBox").style.display="none";
document.getElementById("dashboard").classList.remove("hidden");

document.documentElement.requestFullscreen();
render();
}

// CEK AKTIF
function aktifMapel(m){
let now=new Date();
let t=now.toISOString().split("T")[0];
let j=now.getHours().toString().padStart(2,'0')+":"+
now.getMinutes().toString().padStart(2,'0');

return t===m.t && j>=m.m && j<=m.s;
}

// RENDER
function render(){
let html="";
mapel.forEach((m,i)=>{
let a=aktifMapel(m);

html+=`
<div class="card">
<b>${m.n}</b><br>
${m.t} | ${m.m}-${m.s}<br>

<input placeholder="Token" id="t${i}">
<button class="${a&&m.l?'open':'lock'}" onclick="mulai(${i})">
${a?'Mulai':'Terkunci'}
</button>
</div>`;
});
document.getElementById("jadwal").innerHTML=html;
}

// MULAI
function mulai(i){
let m=mapel[i];

if(!aktifMapel(m)){alert("Belum waktunya");return;}
if(!m.l){alert("Belum tersedia");return;}

let t=document.getElementById("t"+i).value;
if(t!==m.k){alert("Token salah");return;}

aktif=true;

let url=m.l+"?entry.1234567890="+encodeURIComponent(namaUser);
window.open(url,"_blank");
}

// TIMER
setInterval(()=>{
let m=Math.floor(waktu/60);
let s=waktu%60;
document.getElementById("timer").innerHTML=
String(m).padStart(2,'0')+":"+String(s).padStart(2,'0');
waktu--;
},1000);

// ANTI TAB
document.addEventListener("visibilitychange",()=>{
if(document.hidden && aktif){
alert("Keluar dari ujian!");
window.close();
}
});

// BLOK
document.onkeydown=function(e){
if(e.keyCode==123)return false;
if(e.ctrlKey && e.key==='u')return false;
};
document.addEventListener("contextmenu",e=>e.preventDefault());

</script>
